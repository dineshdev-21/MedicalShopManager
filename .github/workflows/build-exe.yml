name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore MedicalShopManager.sln

      - name: Run Tests
        run: dotnet test MedicalShopManager.sln -c Release --no-restore --verbosity normal

      - name: Publish Single-File Executable
        run: >
          dotnet publish src/MedicalShopManager.App/MedicalShopManager.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./dist/publish

      - name: Copy Documentation to Distribution
        run: |
          Copy-Item README.md ./dist/publish/

      - name: Create Zip Package
        run: |
          Compress-Archive -Path ./dist/publish/* -DestinationPath ./dist/MedicalShopManager-win-x64.zip -Force

      - name: Compile Inno Setup Installer
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/MedicalShopManager.iss

      - name: Upload Build Artifacts (.exe, zip, and setup installer)
        uses: actions/upload-artifact@v4
        with:
          name: MedicalShopManager-Windows-Binaries
          path: |
            ./dist/MedicalShopManager-win-x64.zip
            ./dist/MedicalShopManager-Setup-*.exe
          retention-days: 90

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/MedicalShopManager-win-x64.zip
            ./dist/MedicalShopManager-Setup-*.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
